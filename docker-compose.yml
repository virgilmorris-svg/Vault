services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: sentinelpass_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - media_data:/data/storage
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.vault.rule=Host(`vault54500.duckdns.org`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      - "traefik.http.routers.vault.tls.certresolver=le"
      - "traefik.http.services.vault.loadbalancer.server.port=8000"

volumes:
  mongo_data:
  media_data:

networks:
  traefik-net:
    external: true
